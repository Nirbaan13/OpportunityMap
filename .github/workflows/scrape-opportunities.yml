name: Scrape opportunities

on:
  schedule:
    # Weekly on Sundays at 01:00 UTC — refresh listings + enrich catalog deadlines
    # from official pages. Catalog dates change yearly; weekly is enough for
    # Devpost/hackathon deadlines (reminders fire at 90/30/10/1 days out).
    - cron: "0 1 * * 0"
  workflow_dispatch:
    inputs:
      maintenance_only:
        description: "Only deactivate past deadlines / run maintenance (no scrape)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  scrape:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scraper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install scraper + backend models + Playwright
        run: |
          python -m pip install -U pip
          pip install -e ".[postgres]"
          # Scrapers import SQLAlchemy models from ../backend/app
          pip install -r ../backend/requirements.txt
          if [ "${{ github.event.inputs.maintenance_only }}" != "true" ]; then
            playwright install --with-deps chromium
          fi
      - name: Run automated scrapers (all fields)
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.maintenance_only != 'true' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # So `import app` resolves to backend/app
          PYTHONPATH: ${{ github.workspace }}/backend
        run: |
          python -c "import app, scraper; print('imports ok')"
          # `all` = global_competitions + field_coverage_catalog + expanded_catalog
          #         + pathways_to_science + devpost + competition_sciences (Playwright).
          # After seeding, enrich_catalog_deadlines fetches each undated catalog
          # program's official page and fills deadline_at when a labeled upcoming
          # date is found. Upserts preserve previously enriched future deadlines.
          # Maintenance deactivates past-deadline, unusable-title, and stale rows.
          python -m scraper.main --source all --max-items 200 --max-pages 12 --delay 1.0 --enrich-max-items 100
      - name: Deactivate past deadlines (maintenance only)
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.maintenance_only == 'true' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONPATH: ${{ github.workspace }}/backend
        run: |
          python -c "import app, scraper; print('imports ok')"
          python -m scraper.main --maintenance-only
