name: Scrape opportunities

on:
  schedule:
    # Every 3 days at 01:00 UTC — refresh listings and deadlines
    # (runs on days 1,4,7,...,31; resets at the start of each month)
    - cron: "0 1 */3 * *"
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scraper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install scraper + backend models + Playwright
        run: |
          python -m pip install -U pip
          pip install -e ".[postgres]"
          # Scrapers import SQLAlchemy models from ../backend/app
          pip install -r ../backend/requirements.txt
          playwright install --with-deps chromium
      - name: Run automated scrapers (all fields)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # So `import app` resolves to backend/app
          PYTHONPATH: ${{ github.workspace }}/backend
        run: |
          python -c "import app, scraper; print('imports ok')"
          # `all` = global_competitions + field_coverage_catalog + expanded_catalog
          #         + pathways_to_science + devpost + competition_sciences (Playwright).
          # Catalogs cover every field (math, CS, AI, physics, chemistry, biology,
          # research, engineering, economics, business, social science, writing).
          # Policy: live scrapers keep undated listings (with a deadline_summary) and
          # only drop rows whose parseable deadline has already passed.
          # Upserts update existing rows; maintenance deactivates past-deadline,
          # unusable-title, and stale (unseen 30+ days) listings.
          python -m scraper.main --source all --max-items 200 --max-pages 12 --delay 1.0
